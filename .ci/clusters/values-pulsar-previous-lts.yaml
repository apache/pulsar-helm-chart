# Previous LTS Pulsar version. This is also used in all upgrade tests that install a previously released
# chart version so that Pulsar 5.0 is never deployed with an older chart version.
# Pulsar 5.0.0 no longer publishes the apachepulsar/pulsar-all image. Set the repository explicitly since
# previously released chart versions default to apachepulsar/pulsar-all.
# Chart versions before 4.6.0 can't run the apachepulsar/pulsar 4.0.x image (they hard-code a BookKeeper
# statsProviderClass that isn't included in it), so upgrade tests must start from 4.6.0 or later.
defaultPulsarImageRepository: apachepulsar/pulsar
defaultPulsarImageTag: 4.0.14
