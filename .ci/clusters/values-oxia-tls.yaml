# Oxia as the metadata store, with mTLS on the traffic between the Oxia processes:
# replication between the servers and the coordinator's calls to them.
components:
  zookeeper: false
  oxia: true
  # .ci/values-common.yaml enables functions, which on Oxia need FileSystemPackagesStorage
  # (covered by values-oxia.yaml)
  functions: false

tls:
  enabled: true
  oxia:
    enabled: true
    clientAuth: true

certs:
  internal_issuer:
    enabled: true
    type: selfsigning

oxia:
  initialShardCount: 3
  replicationFactor: 3
  server:
    replicas: 3
    cpuLimit: 333m
    memoryLimit: 200Mi
    dbCacheSizeMb: 100
    storageSize: 1Gi
