{{- if and .Values.components.oxia .Values.oxia.networkPolicy.enabled }}
{{- $oxiaPods := list (printf "%s-server" .Values.oxia.component) (printf "%s-coordinator" .Values.oxia.component) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "pulsar.fullname" . }}-{{ .Values.oxia.component }}
  namespace: {{ template "pulsar.namespace" . }}
  labels:
    {{- include "pulsar.standardLabels" . | nindent 4 }}
    component: {{ .Values.oxia.component }}
spec:
  podSelector:
    matchLabels:
      {{- include "pulsar.matchLabels" . | nindent 6 }}
    matchExpressions:
      - key: component
        operator: In
        values:
          {{- toYaml $oxiaPods | nindent 10 }}
  policyTypes:
    - Ingress
  ingress:
    # Client API, used by the Pulsar components
    - ports:
        - port: {{ .Values.oxia.server.ports.public }}
      {{- with .Values.oxia.networkPolicy.public.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Server and coordinator metrics
    - ports:
        {{- range list .Values.oxia.server.ports.metrics .Values.oxia.coordinator.ports.metrics | uniq }}
        - port: {{ . }}
        {{- end }}
      {{- with .Values.oxia.networkPolicy.metrics.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Server internal endpoint (coordination and replication), coordinator internal endpoint and
    # coordinator admin endpoint (6651, Oxia's default, which the chart doesn't change): only the
    # Oxia pods of this release
    - ports:
        {{- range list .Values.oxia.server.ports.internal .Values.oxia.coordinator.ports.internal 6651 | uniq }}
        - port: {{ . }}
        {{- end }}
      from:
        - podSelector:
            matchLabels:
              {{- include "pulsar.matchLabels" . | nindent 14 }}
            matchExpressions:
              - key: component
                operator: In
                values:
                  {{- toYaml $oxiaPods | nindent 18 }}
        {{- with .Values.oxia.networkPolicy.internal.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
