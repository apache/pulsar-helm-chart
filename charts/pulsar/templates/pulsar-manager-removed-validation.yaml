{{- /*
Pulsar Manager support was removed from the chart. Fail fast when a user still enables the
component so that the removal is explicit instead of silently dropping the deployed resources.

This check lives in a rendered template (not a `_`-prefixed partial) so that the `fail` is executed.
*/ -}}
{{- if .Values.components.pulsar_manager }}
{{- fail "ERROR: Pulsar Manager support has been removed from the Apache Pulsar Helm chart. Remove the `components.pulsar_manager` key from your values (or set it to false), together with the `pulsar_manager` section, `images.pulsar_manager` and `auth.superUsers.manager`, to continue. Dekaf is the supported alternative UI in this chart: set `components.dekaf: true`. See the 'Pulsar Manager support has been removed' section in README.md." }}
{{- end }}
