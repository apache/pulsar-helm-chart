{{- if and .Values.components.autorecovery (not .Values.standalone.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ template "pulsar.fullname" . }}-{{ .Values.autorecovery.component }}"
  namespace: {{ template "pulsar.namespace" . }}
  annotations: {{ .Values.autorecovery.appAnnotations | toYaml | nindent 4 }}
  labels:
    {{- include "pulsar.standardLabels" . | nindent 4 }}
    component: {{ .Values.autorecovery.component }}
spec:
  serviceName: "{{ template "pulsar.fullname" . }}-{{ .Values.autorecovery.component }}"
  replicas: {{ .Values.autorecovery.replicaCount }}
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  # nodeSelector:
  selector:
    matchLabels:
      {{- include "pulsar.matchLabels" . | nindent 6 }}
      component: {{ .Values.autorecovery.component }}
  template:
    metadata:
      labels:
        {{- include "pulsar.template.labels" . | nindent 8 }}
        component: {{ .Values.autorecovery.component }}
      annotations:
        {{- if not .Values.autorecovery.podMonitor.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.autorecovery.ports.http }}"
        {{- end }}
        {{- if .Values.autorecovery.restartPodsOnConfigMapChange }}
        checksum/config: {{ include (print $.Template.BasePath "/autorecovery-configmap.yaml") . | sha256sum }}
        {{- end }}
{{- with .Values.autorecovery.annotations }}
{{ toYaml . | indent 8 }}
{{- end }}
    spec:
    {{- if .Values.autorecovery.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.autorecovery.nodeSelector | indent 8 }}
    {{- end }}
    {{- if .Values.autorecovery.priorityClassName }}
      priorityClassName: {{ .Values.autorecovery.priorityClassName }}
    {{- end }}
    {{- if .Values.autorecovery.tolerations }}
      tolerations:
{{- with .Values.autorecovery.tolerations }}
{{ toYaml . | indent 8 }}
{{- end }}
    {{- end }}
    {{- if .Values.autorecovery.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.autorecovery.topologySpreadConstraints | nindent 8 }}
    {{- end }}
      affinity:
        {{- with .Values.autorecovery.affinity.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if and .Values.affinity.anti_affinity .Values.autorecovery.affinity.anti_affinity}}
        podAntiAffinity:
          {{ if eq .Values.autorecovery.affinity.type "requiredDuringSchedulingIgnoredDuringExecution"}}
          {{ .Values.autorecovery.affinity.type }}:
          - labelSelector:
              matchExpressions:
              - key: "app"
                operator: In
                values:
                - "{{ template "pulsar.name" . }}"
              - key: "release"
                operator: In
                values:
                - {{ .Release.Name }}
              - key: "component"
                operator: In
                values:
                - {{ .Values.autorecovery.component }}
            topologyKey: {{ .Values.autorecovery.affinity.anti_affinity_topology_key }}
        {{ else }}
          {{ .Values.autorecovery.affinity.type }}:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: "app"
                      operator: In
                      values:
                      - "{{ template "pulsar.name" . }}"
                    - key: "release"
                      operator: In
                      values:
                      - {{ .Release.Name }}
                    - key: "component" 
                      operator: In
                      values:
                      - {{ .Values.autorecovery.component }}
                topologyKey: {{ .Values.autorecovery.affinity.anti_affinity_topology_key }}
        {{ end }}
        {{- end }}
      terminationGracePeriodSeconds: {{ .Values.autorecovery.gracePeriod }}
      serviceAccountName: "{{ template "pulsar.fullname" . }}-{{ .Values.autorecovery.component }}"
      {{- $edv := fromJsonArray (include "pulsar.emptyDirVolumes.resolve" (dict "component" .Values.autorecovery "root" .)) }}
      {{- include "pulsar.podSecurityContext" (dict "securityContext" .Values.autorecovery.securityContext "root" . "indent" 6) }}
      initContainers:
      {{- if include "pulsar.emptyDirVolumes.enabled" (dict "securityContext" .Values.autorecovery.containerSecurityContext "volumes" $edv "root" .) }}
      {{- include "pulsar.emptyDirVolumes.seedContainer" (dict "volumes" $edv "image" .Values.images.autorecovery "securityContext" .Values.autorecovery.containerSecurityContext "root" .) | nindent 6 }}
      {{- end }}
      {{- if .Values.tls.autorecovery.cacerts.enabled }}
      - name: cacerts
        image: "{{ template "pulsar.imageFullName" (dict "image" .Values.images.autorecovery "root" .) }}"
        imagePullPolicy: "{{ template "pulsar.imagePullPolicy" (dict "image" .Values.images.autorecovery "root" .) }}"
        {{- include "pulsar.containerSecurityContext" (dict "securityContext" .Values.autorecovery.containerSecurityContext "root" . "indent" 8) }}
        resources: {{ toYaml .Values.initContainer.resources | nindent 10 }}
        command: ["sh", "-c"]
        args:
        - |
          bin/certs-combine-pem.sh /pulsar/certs/cacerts/ca-combined.pem {{ template "pulsar.certs.cacerts" (dict "certs" .Values.tls.autorecovery.cacerts.certs) }}
        volumeMounts:
        {{- if .Values.autorecovery.initContainersExtraVolumeMounts }}
{{ toYaml .Values.autorecovery.initContainersExtraVolumeMounts | indent 8 }}
        {{- end }}
        {{- include "pulsar.autorecovery.certs.volumeMounts" . | nindent 8 }}
        {{- if include "pulsar.emptyDirVolumes.enabled" (dict "securityContext" .Values.autorecovery.containerSecurityContext "volumes" $edv "root" .) }}
        {{- include "pulsar.emptyDirVolumes.mounts" $edv | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if and .Values.autorecovery.waitBookkeeperTimeout (gt (.Values.autorecovery.waitBookkeeperTimeout | int) 0) }}
      # This initContainer will wait for bookkeeper initnewcluster to complete
      # before deploying the bookies
      - name: pulsar-bookkeeper-verify-clusterid
        image: "{{ template "pulsar.imageFullName" (dict "image" .Values.images.autorecovery "root" .) }}"
        imagePullPolicy: "{{ template "pulsar.imagePullPolicy" (dict "image" .Values.images.autorecovery "root" .) }}"
        {{- include "pulsar.containerSecurityContext" (dict "securityContext" .Values.autorecovery.containerSecurityContext "root" . "indent" 8) }}
        resources: {{ toYaml .Values.initContainer.resources | nindent 10 }}
        command: ["timeout", "{{ .Values.autorecovery.waitBookkeeperTimeout }}", "sh", "-c"]
        args:
        - |
          {{- include "pulsar.autorecovery.init.verify_cluster_id" . | nindent 10 }}
        envFrom:
        - configMapRef:
            name: "{{ template "pulsar.fullname" . }}-{{ .Values.autorecovery.component }}"
        volumeMounts:
        {{- if .Values.autorecovery.initContainersExtraVolumeMounts }}
{{ toYaml .Values.autorecovery.initContainersExtraVolumeMounts | indent 8 }}
        {{- end }}
        {{- include "pulsar.autorecovery.certs.volumeMounts" . | nindent 8 }}
        {{- if include "pulsar.emptyDirVolumes.enabled" (dict "securityContext" .Values.autorecovery.containerSecurityContext "volumes" $edv "root" .) }}
        {{- include "pulsar.emptyDirVolumes.mounts" $edv | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if .Values.autorecovery.initContainers }}
        {{- toYaml .Values.autorecovery.initContainers | nindent 6 }}
      {{- end }}
      containers:
      - name: "{{ template "pulsar.fullname" . }}-{{ .Values.autorecovery.component }}"
        image: "{{ template "pulsar.imageFullName" (dict "image" .Values.images.autorecovery "root" .) }}"
        imagePullPolicy: "{{ template "pulsar.imagePullPolicy" (dict "image" .Values.images.autorecovery "root" .) }}"
        {{- include "pulsar.containerSecurityContext" (dict "securityContext" .Values.autorecovery.containerSecurityContext "root" . "indent" 8) }}
        {{- /*
        The autorecovery daemon does not start BookKeeper's HTTP service, so there is no
        /api/v1 endpoint to probe as there is on a bookie. It does start the Prometheus
        stats endpoint on autorecovery.ports.http, which is the same endpoint the
        PodMonitor scrapes, so /metrics is what these probes target.

        Every lookup below goes through `dig`, because `autorecovery.probe` is a new key:
        under `helm upgrade --reuse-values` the new chart's defaults are not coalesced in,
        so the map is absent and a direct dereference aborts the whole render.

        All three are off by default, so this adds a knob rather than behaviour. /metrics
        is served by the image's BookKeeper stats provider rather than by anything the
        chart configures, so a cluster overriding statsProviderClass or
        prometheusStatsHttpPort through autorecovery.configData would break liveness
        (restart loop) and readiness (permanently unready, stalling the rollout) alike.
        */}}
        {{- $probe := .Values.autorecovery.probe | default dict }}
        {{- if dig "liveness" "enabled" false $probe }}
        livenessProbe:
          httpGet:
            path: /metrics
            port: {{ .Values.autorecovery.ports.http }}
          initialDelaySeconds: {{ dig "liveness" "initialDelaySeconds" 10 $probe }}
          periodSeconds: {{ dig "liveness" "periodSeconds" 30 $probe }}
          timeoutSeconds: {{ dig "liveness" "timeoutSeconds" 5 $probe }}
          failureThreshold: {{ dig "liveness" "failureThreshold" 60 $probe }}
        {{- end }}
        {{- if dig "readiness" "enabled" false $probe }}
        readinessProbe:
          httpGet:
            path: /metrics
            port: {{ .Values.autorecovery.ports.http }}
          initialDelaySeconds: {{ dig "readiness" "initialDelaySeconds" 10 $probe }}
          periodSeconds: {{ dig "readiness" "periodSeconds" 30 $probe }}
          timeoutSeconds: {{ dig "readiness" "timeoutSeconds" 5 $probe }}
          failureThreshold: {{ dig "readiness" "failureThreshold" 60 $probe }}
        {{- end }}
        {{- if dig "startup" "enabled" false $probe }}
        startupProbe:
          httpGet:
            path: /metrics
            port: {{ .Values.autorecovery.ports.http }}
          initialDelaySeconds: {{ dig "startup" "initialDelaySeconds" 10 $probe }}
          periodSeconds: {{ dig "startup" "periodSeconds" 30 $probe }}
          timeoutSeconds: {{ dig "startup" "timeoutSeconds" 5 $probe }}
          failureThreshold: {{ dig "startup" "failureThreshold" 60 $probe }}
        {{- end }}
      {{- if .Values.autorecovery.resources }}
        resources:
{{ toYaml .Values.autorecovery.resources | indent 10 }}
      {{- end }}
        command: ["sh", "-c"]
        args:
        - |
          {{- if .Values.tls.autorecovery.cacerts.enabled }}
          cd /pulsar/certs/cacerts;
          nohup /pulsar/bin/certs-combine-pem-infinity.sh /pulsar/certs/cacerts/ca-combined.pem {{ template "pulsar.certs.cacerts" (dict "certs" .Values.tls.autorecovery.cacerts.certs) }} > /pulsar/certs/cacerts/certs-combine-pem-infinity.log 2>&1 &
          cd /pulsar;
          {{- end }}
          bin/apply-config-from-env.py conf/bookkeeper.conf;
          {{- include "pulsar.autorecovery.zookeeper.tls.settings" . | nindent 10 }}
          OPTS="${OPTS} -Dlog4j2.formatMsgNoLookups=true" exec bin/bookkeeper autorecovery
        ports:
        - name: http
          containerPort: {{ .Values.autorecovery.ports.http }}
        envFrom:
        - configMapRef:
            name: "{{ template "pulsar.fullname" . }}-{{ .Values.autorecovery.component }}"
        volumeMounts:
        {{- if .Values.autorecovery.extraVolumeMounts }}
{{ toYaml .Values.autorecovery.extraVolumeMounts | indent 8 }}
        {{- end }}
        {{- include "pulsar.autorecovery.certs.volumeMounts" . | nindent 8 }}
        {{- if include "pulsar.emptyDirVolumes.enabled" (dict "securityContext" .Values.autorecovery.containerSecurityContext "volumes" $edv "root" .) }}
        {{- include "pulsar.emptyDirVolumes.mounts" $edv | nindent 8 }}
        {{- end }}
      volumes:
      {{- if include "pulsar.emptyDirVolumes.enabled" (dict "securityContext" .Values.autorecovery.containerSecurityContext "volumes" $edv "root" .) }}
      {{- include "pulsar.emptyDirVolumes.volumes" $edv | nindent 6 }}
      {{- end }}
      {{- include "pulsar.autorecovery.certs.volumes" . | nindent 6 }}
      {{- if .Values.autorecovery.extraVolumes }}
{{ toYaml .Values.autorecovery.extraVolumes | indent 6 }}
      {{- end }}
      {{- include "pulsar.imagePullSecrets" . | nindent 6}}
{{- end }}

