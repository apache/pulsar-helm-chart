# Run the cluster under the Kubernetes `restricted` Pod Security Standard, i.e. in a
# namespace labelled:
#
#   pod-security.kubernetes.io/enforce: restricted
#
# These are the controls `restricted` actually enforces. It places no constraint on
# `fsGroup`, `fsGroupChangePolicy` or `supplementalGroups`, so the chart's per-component
# `fsGroup: 0` defaults are left exactly as they are -- they are what makes the Pulsar
# images work under an arbitrary assigned UID, and `fsGroup: 0` is admitted by
# `restricted` unchanged.
#
# If your cluster additionally runs a policy that constrains group IDs to a numeric
# range, see values-restricted-group-ranges.yaml.

# The bundled monitoring stack is not restricted-compliant, and the securityContext
# settings below do not reach subchart templates: node-exporter needs hostNetwork,
# hostPID and hostPath, Grafana chowns as root, and some workloads set no seccompProfile.
# Left enabled its pods are rejected on admission while Pulsar itself comes up fine, so
# deploy monitoring separately into a namespace with a policy that suits it.
victoria-metrics-k8s-stack:
  enabled: false

# Applied to every pod the chart renders, including the init/cleanup Jobs.
podSecurityContext:
  runAsNonRoot: true
  # Set explicitly because the sts-cleanup pre-upgrade hooks run alpine/k8s, which has
  # no USER directive: with runAsNonRoot and no runAsUser the kubelet refuses them
  # ("image will run as root") and `helm upgrade` is blocked. 10000 is the uid of the
  # `pulsar` user in the apachepulsar images, and kubectl runs fine under it too.
  runAsUser: 10000

# Applied to every container and initContainer. This matches the container-level controls
# of both PSS `restricted` and OpenShift's `restricted-v2` SCC.
#
# readOnlyRootFilesystem is in neither standard but is supported here; see the README for
# what it mounts, and note that logs on an emptyDir do not survive pod replacement.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
